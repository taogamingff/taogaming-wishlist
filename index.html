
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist Portal</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #f5f5f5;
      background: #10131c;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 28px;
      border: 1px solid #34394b;
      border-radius: 18px;
      background: #1a1f2d;
    }

    h1 { margin-top: 0; font-size: 25px; }
    p { color: #c3c9d8; line-height: 1.6; }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 15px;
    }

    input {
      color: white;
      background: #10131c;
      border: 1px solid #444b60;
    }

    button {
      border: 0;
      color: white;
      background: #635bff;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #5148e5; }
    .hidden { display: none; }
    .status { overflow-wrap: anywhere; }
    a { color: #a9b2ff; }
  </style>
</head>
<body>
  <main class="card">
    <!-- TRANG 1 -->
    <section id="page1">
      <h1>Wishlist Portal</h1>
      <p>Nhập JWT token để tiếp tục đến trang Wishlist.</p>

      <form id="tokenForm">
        <input
          id="jwtInput"
          type="password"
          placeholder="Nhập JWT token"
          autocomplete="off"
          required
        >
        <button type="submit">Tiếp tục</button>
      </form>

      <p id="error" class="status" role="alert"></p>
    </section>

    <!-- TRANG 2 -->
    <section id="page2" class="hidden">
      <h1>Wishlist</h1>
      <p id="status" class="status" role="status">
        Đang chuẩn bị chuyển trang...
      </p>
      <button id="openWishlist">Mở Wishlist</button>
      <button id="backButton">Quay lại</button>
    </section>
  </main>

  <script>
    const WISHLIST_URL =
      "https://wishlist-banner.vercel.app/wishlist";

    const page1 = document.getElementById("page1");
    const page2 = document.getElementById("page2");
    const input = document.getElementById("jwtInput");
    const error = document.getElementById("error");
    const status = document.getElementById("status");

    let currentToken = "";

    function showPage2(token) {
      currentToken = token.trim();

      if (!currentToken) {
        error.textContent = "Vui lòng nhập token.";
        return;
      }

      page1.classList.add("hidden");
      page2.classList.remove("hidden");

      status.textContent =
        "Đã nhận token. Nhấn Mở Wishlist để tiếp tục.";

      history.replaceState(
        { page: 2 },
        "",
        location.pathname + "#wishlist"
      );
    }

    function openWishlist() {
      if (!currentToken) return;

      const destination = new URL(WISHLIST_URL);

      destination.searchParams.set(
        "jwt_token",
        currentToken
      );

      // Không tự động thêm action=unban.
      // Không ghi token vào localStorage hoặc console.
      window.location.assign(destination.href);
    }

    document.getElementById("tokenForm")
      .addEventListener("submit", function (event) {
        event.preventDefault();
        error.textContent = "";
        showPage2(input.value);
      });

    document.getElementById("openWishlist")
      .addEventListener("click", openWishlist);

    document.getElementById("backButton")
      .addEventListener("click", function () {
        currentToken = "";
        input.value = "";
        page2.classList.add("hidden");
        page1.classList.remove("hidden");
      });

    // Nhận diện token nếu URL hiện tại có jwt_token.
    const params = new URLSearchParams(location.search);
    const urlToken = params.get("jwt_token");

    if (urlToken && urlToken !== "YOUR_JWT") {
      showPage2(urlToken);
    }
  </script>
</body>
</html>
