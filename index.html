
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <title>QUẢN LÝ WISHLIST</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: #10131d; color: #f5f7ff;
      font-family: system-ui, Arial, sans-serif;
    }
    header {
      padding: 24px 16px; text-align: center;
      background: #191e2c; border-bottom: 1px solid #30384b;
    }
    h1 { margin: 0; font-size: 25px; }
    header p { color: #aab4c9; margin: 8px 0 0; }
    main { width: min(900px, 94%); margin: 24px auto; }
    .panel {
      padding: 20px; margin-bottom: 18px;
      background: #191e2c; border: 1px solid #30384b;
      border-radius: 16px;
    }
    h2 { margin-top: 0; font-size: 18px; }
    label { display: block; margin: 12px 0 6px; color: #c5cde0; }
    input, button {
      width: 100%; padding: 12px; border-radius: 9px;
      font: inherit;
    }
    input {
      color: white; background: #101521;
      border: 1px solid #414b63; min-width: 0;
    }
    button {
      color: white; background: #635bff;
      border: 0; cursor: pointer; font-weight: 700;
    }
    button:disabled { opacity: .5; cursor: wait; }
    button.secondary { background: #30394d; }
    button.danger { background: #b8324b; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .muted { color: #9da8bf; font-size: 13px; }
    .status { margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .items {
      display: grid; grid-template-columns: repeat(auto-fill,minmax(120px,1fr));
      gap: 12px; margin-top: 16px;
    }
    .item {
      min-width: 0; text-align: center; padding: 12px 8px;
      border-radius: 12px; background: #101521;
      border: 1px solid #30384b;
    }
    .item img { width: 76px; height: 76px; object-fit: contain; }
    .item code { display: block; overflow-wrap: anywhere; margin: 8px 0; }
    .item button { padding: 8px; font-size: 12px; }
    .hidden { display: none !important; }
    @media(max-width: 500px) {
      .grid { grid-template-columns: 1fr; }
      .panel { padding: 15px; }
    }
  </style>
</head>
<body>
<header>
  <h1>QUẢN LÝ WISHLIST</h1>
  <p>QUẢN LÝ &amp; THÊM &amp; XÓA WISHLIST</p>
</header>

<main>
  <section id="loginPage" class="panel">
    <h2>Đăng nhập Wishlist</h2>
    <p class="muted">Chọn tệp .dat có chứa guest_account_info.</p>

    <label for="datFile">Tệp tài khoản (.dat)</label>
    <input id="datFile" type="file" accept=".dat,.json,.txt,application/json">

    <label for="uid">Guest UID</label>
    <input id="uid" autocomplete="off" placeholder="Tự nhận dạng từ tệp">

    <label for="password">Guest Password</label>
    <input id="password" type="password" autocomplete="off"
      placeholder="Tự nhận dạng từ tệp">

    <button id="loginBtn" style="margin-top:16px">Tiếp tục</button>
    <div id="loginStatus" class="status" role="status"></div>
  </section>

  <section id="wishlistPage" class="hidden">
    <div class="panel">
      <h2>Quản lý Wishlist</h2>
      <p id="accountLabel" class="muted"></p>

      <label for="itemIds">Nhập ID item (mỗi dòng một ID)</label>
      <input id="itemIds" placeholder="203055024, 203055025">

      <div class="grid" style="margin-top:12px">
        <button id="addBtn">Thêm</button>
        <button id="removeBtn" class="danger">Xóa item</button>
      </div>
      <button id="refreshBtn" class="secondary" style="margin-top:12px">
        Tải danh sách
      </button>
      <button id="logoutBtn" class="secondary" style="margin-top:8px">
        Quay lại
      </button>
      <div id="apiStatus" class="status" role="status"></div>
    </div>

    <div class="panel">
      <h2>Danh sách mong muốn <span id="count">0</span>/100</h2>
      <p class="muted">Ảnh lỗi sẽ được thay bằng thông báo; ID vẫn được giữ.</p>
      <div id="items" class="items"></div>
      <p id="empty" class="muted">Chưa có dữ liệu danh sách.</p>
    </div>
  </section>
</main>

<script type="module">
  import { wishlistRequest } from "./api.js";

  const $ = id => document.getElementById(id);
  const state = { uid: "", password: "", items: [] };

  function status(id, message) {
    $(id).textContent = message;
  }

  function normalizeId(value) {
    const id = String(value ?? "").trim();
    return /^\d{1,20}$/.test(id) ? id : null;
  }

  function parseIds(value) {
    return [...new Set(
      value.split(/[\s,;]+/).map(normalizeId).filter(Boolean)
    )];
  }

  // Hỗ trợ JSON thuần hoặc JSON nằm trong văn bản của tệp.
  function extractCredentials(text) {
    const keyUid = "com.garena.msdk.guest_uid";
    const keyPassword = "com.garena.msdk.guest_password";

    const candidates = [text];
    const first = text.indexOf("{");
    const last = text.lastIndexOf("}");

    if (first >= 0 && last > first) {
      candidates.push(text.slice(first, last + 1));
    }

    for (const candidate of candidates) {
      try {
        const obj = JSON.parse(candidate);
        const info = obj?.guest_account_info ?? obj;
        if (info[keyUid] && info[keyPassword]) {
          return {
            uid: String(info[keyUid]),
            password: String(info[keyPassword])
          };
        }
      } catch {}
    }

    // Chỉ dùng biểu thức dự phòng nếu tệp chứa JSON không nguyên vẹn.
    const uidMatch = text.match(
      /"com\.garena\.msdk\.guest_uid"\s*:\s*"([^"]+)"/
    );
    const passwordMatch = text.match(
      /"com\.garena\.msdk\.guest_password"\s*:\s*"([^"]+)"/
    );

    if (uidMatch && passwordMatch) {
      return { uid: uidMatch[1], password: passwordMatch[1] };
    }

    throw new Error("Không tìm thấy đủ UID và Password trong tệp.");
  }

  $("datFile").addEventListener("change", async event => {
    const file = event.target.files?.[0];
    if (!file) return;

    try {
      if (file.size > 5 * 1024 * 1024) {
        throw new Error("Tệp vượt quá giới hạn 5 MB.");
      }
      const credentials = extractCredentials(await file.text());
      $("uid").value = credentials.uid;
      $("password").value = credentials.password;
      status("loginStatus", "Đã đọc được thông tin từ tệp.");
    } catch (error) {
      status("loginStatus", error.message);
    }
  });

  function renderItems() {
    const container = $("items");
    container.replaceChildren();

    $("count").textContent = state.items.length;
    $("empty").classList.toggle("hidden", state.items.length > 0);

    for (const id of state.items) {
      const card = document.createElement("div");
      card.className = "item";

      const img = document.createElement("img");
      img.src = `https://kingofgames02.github.io/Free-Fire-Items-Library/ff-icons/${encodeURIComponent(id)}.png`;
      img.alt = `Item ${id}`;
      img.loading = "lazy";
      img.onerror = () => {
        img.removeAttribute("src");
        img.alt = "Không tải được ảnh";
      };

      const code = document.createElement("code");
      code.textContent = id;

      const remove = document.createElement("button");
      remove.className = "danger";
      remove.textContent = "Xóa ID";
      remove.addEventListener("click", () => {
        $("itemIds").value = id;
      });

      card.append(img, code, remove);
      container.append(card);
    }
  }

  async function runApi(action, ids = []) {
    status("apiStatus", "Đang xử lý...");
    $("addBtn").disabled = true;
    $("removeBtn").disabled = true;

    try {
      const result = await wishlistRequest({
        uid: state.uid,
        password: state.password,
        action,
        itemIds: ids
      });

      // Cần điều chỉnh theo schema thực tế mà API trả về.
      const list = result?.items ?? result?.wishlist ?? result?.data?.items;
      if (Array.isArray(list)) {
        state.items = list
          .map(item => normalizeId(
            typeof item === "object" ? item.id ?? item.item_id : item
          ))
          .filter(Boolean)
          .slice(0, 100);
        renderItems();
      }

      status("apiStatus", result?.message || "API đã phản hồi thành công.");
      return result;
    } catch (error) {
      status("apiStatus", error.message);
    } finally {
      $("addBtn").disabled = false;
      $("removeBtn").disabled = false;
    }
  }

  $("loginBtn").addEventListener("click", () => {
    const uid = $("uid").value.trim();
    const password = $("password").value.trim();

    if (!uid || !password) {
      status("loginStatus", "Vui lòng nhập đủ UID và Password.");
      return;
    }

    state.uid = uid;
    state.password = password;
    $("accountLabel").textContent = `UID: ${uid}`;
    $("loginPage").classList.add("hidden");
    $("wishlistPage").classList.remove("hidden");
    status("loginStatus", "");
    runApi("list");
  });

  $("addBtn").addEventListener("click", () => {
    const ids = parseIds($("itemIds").value);
    if (!ids.length) {
      status("apiStatus", "Nhập ít nhất một ID item hợp lệ.");
      return;
    }
    runApi("add", ids);
  });

  $("removeBtn").addEventListener("click", () => {
    const ids = parseIds($("itemIds").value);
    if (!ids.length) {
      status("apiStatus", "Nhập ID item cần xóa.");
      return;
    }
    runApi("remove", ids);
  });

  $("refreshBtn").addEventListener("click", () => runApi("list"));

  $("logoutBtn").addEventListener("click", () => {
    state.uid = "";
    state.password = "";
    $("uid").value = "";
    $("password").value = "";
    $("datFile").value = "";
    $("wishlistPage").classList.add("hidden");
    $("loginPage").classList.remove("hidden");
  });

  renderItems();
</script>
</body>
</html>
